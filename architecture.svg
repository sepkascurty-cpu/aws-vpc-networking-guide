<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="720" viewBox="0 0 1240 720" font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="vpcbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#64748b" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="720" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="620" y="44" text-anchor="middle" font-size="30" font-weight="700" fill="#0f172a">AWS VPC — Two-AZ Reference Architecture</text>
  <text x="620" y="72" text-anchor="middle" font-size="16" fill="#64748b">10.0.0.0/16 · eu-west-1a / eu-west-1b</text>

  <!-- VPC -->
  <rect x="30" y="92" width="1180" height="600" rx="14" fill="url(#vpcbg)" stroke="#94a3b8" stroke-width="2" stroke-dasharray="10,6"/>
  <text x="52" y="124" font-size="18" font-weight="700" fill="#475569">VPC 10.0.0.0/16</text>

  <!-- AZ A -->
  <rect x="52" y="140" width="560" height="520" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="72" y="168" font-size="16" font-weight="700" fill="#334155">AZ-a (eu-west-1a)</text>

  <!-- AZ B -->
  <rect x="628" y="140" width="560" height="520" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="648" y="168" font-size="16" font-weight="700" fill="#334155">AZ-b (eu-west-1b)</text>

  <!-- Public subnet A -->
  <rect x="72" y="188" width="520" height="200" rx="8" fill="#dcfce7" stroke="#22c55e"/>
  <text x="90" y="214" font-size="15" font-weight="700" fill="#15803d">Public subnet 10.0.0.0/24</text>
  <rect x="100" y="230" width="150" height="56" rx="8" fill="#ffffff" stroke="#22c55e"/>
  <text x="175" y="254" text-anchor="middle" font-size="14" font-weight="600" fill="#166534">ALB</text>
  <text x="175" y="272" text-anchor="middle" font-size="11" fill="#64748b">inbound traffic</text>
  <rect x="290" y="230" width="260" height="56" rx="8" fill="#ffffff" stroke="#22c55e"/>
  <text x="420" y="254" text-anchor="middle" font-size="14" font-weight="600" fill="#166534">Route table (public)</text>
  <text x="420" y="272" text-anchor="middle" font-size="11" fill="#64748b">0.0.0.0/0 → igw</text>

  <!-- Private subnet A -->
  <rect x="72" y="408" width="520" height="232" rx="8" fill="#ffedd5" stroke="#f97316"/>
  <text x="90" y="434" font-size="15" font-weight="700" fill="#c2410c">Private subnet 10.0.2.0/24</text>
  <rect x="100" y="450" width="150" height="56" rx="8" fill="#ffffff" stroke="#f97316"/>
  <text x="175" y="474" text-anchor="middle" font-size="14" font-weight="600" fill="#9a3412">EC2 app</text>
  <text x="175" y="492" text-anchor="middle" font-size="11" fill="#64748b">+ security group</text>
  <rect x="290" y="450" width="260" height="56" rx="8" fill="#ffffff" stroke="#f97316"/>
  <text x="420" y="474" text-anchor="middle" font-size="14" font-weight="600" fill="#9a3412">Route table (private)</text>
  <text x="420" y="492" text-anchor="middle" font-size="11" fill="#64748b">0.0.0.0/0 → nat-a</text>
  <rect x="100" y="524" width="150" height="56" rx="8" fill="#ffffff" stroke="#f97316"/>
  <text x="175" y="548" text-anchor="middle" font-size="14" font-weight="600" fill="#9a3412">RDS</text>
  <text x="175" y="566" text-anchor="middle" font-size="11" fill="#64748b">data tier</text>

  <!-- Public subnet B -->
  <rect x="648" y="188" width="520" height="200" rx="8" fill="#dcfce7" stroke="#22c55e"/>
  <text x="666" y="214" font-size="15" font-weight="700" fill="#15803d">Public subnet 10.0.1.0/24</text>
  <rect x="676" y="230" width="150" height="56" rx="8" fill="#ffffff" stroke="#22c55e"/>
  <text x="751" y="254" text-anchor="middle" font-size="14" font-weight="600" fill="#166534">ALB</text>
  <text x="751" y="272" text-anchor="middle" font-size="11" fill="#64748b">(cross-zone)</text>
  <rect x="866" y="230" width="260" height="56" rx="8" fill="#ffffff" stroke="#22c55e"/>
  <text x="996" y="254" text-anchor="middle" font-size="14" font-weight="600" fill="#166534">Route table (public)</text>
  <text x="996" y="272" text-anchor="middle" font-size="11" fill="#64748b">0.0.0.0/0 → igw</text>

  <!-- Private subnet B -->
  <rect x="648" y="408" width="520" height="232" rx="8" fill="#ffedd5" stroke="#f97316"/>
  <text x="666" y="434" font-size="15" font-weight="700" fill="#c2410c">Private subnet 10.0.3.0/24</text>
  <rect x="676" y="450" width="150" height="56" rx="8" fill="#ffffff" stroke="#f97316"/>
  <text x="751" y="474" text-anchor="middle" font-size="14" font-weight="600" fill="#9a3412">EC2 app</text>
  <text x="751" y="492" text-anchor="middle" font-size="11" fill="#64748b">+ security group</text>
  <rect x="866" y="450" width="260" height="56" rx="8" fill="#ffffff" stroke="#f97316"/>
  <text x="996" y="474" text-anchor="middle" font-size="14" font-weight="600" fill="#9a3412">Route table (private)</text>
  <text x="996" y="492" text-anchor="middle" font-size="11" fill="#64748b">0.0.0.0/0 → nat-b</text>
  <rect x="676" y="524" width="150" height="56" rx="8" fill="#ffffff" stroke="#f97316"/>
  <text x="751" y="548" text-anchor="middle" font-size="14" font-weight="600" fill="#9a3412">RDS standby</text>
  <text x="751" y="566" text-anchor="middle" font-size="11" fill="#64748b">multi-AZ</text>

  <!-- Internet Gateway -->
  <rect x="470" y="300" width="300" height="60" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="620" y="326" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8">Internet Gateway (igw)</text>
  <text x="620" y="346" text-anchor="middle" font-size="11" fill="#64748b">attached to VPC — entry point from the internet</text>

  <!-- NAT gateways -->
  <rect x="330" y="600" width="240" height="44" rx="8" fill="#fef9c3" stroke="#eab308"/>
  <text x="450" y="627" text-anchor="middle" font-size="14" font-weight="600" fill="#854d0e">NAT Gateway (nat-a) + EIP</text>
  <rect x="670" y="600" width="240" height="44" rx="8" fill="#fef9c3" stroke="#eab308"/>
  <text x="790" y="627" text-anchor="middle" font-size="14" font-weight="600" fill="#854d0e">NAT Gateway (nat-b) + EIP</text>

  <!-- VPC endpoint -->
  <rect x="880" y="300" width="260" height="60" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="1010" y="326" text-anchor="middle" font-size="15" font-weight="700" fill="#6d28d9">Gateway Endpoint</text>
  <text x="1010" y="346" text-anchor="middle" font-size="11" fill="#64748b">S3 · DynamoDB — free, private</text>

  <!-- Internet label -->
  <rect x="100" y="300" width="200" height="60" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="200" y="326" text-anchor="middle" font-size="15" font-weight="700" fill="#475569">Internet</text>
  <text x="200" y="346" text-anchor="middle" font-size="11" fill="#64748b">users / API clients</text>

  <!-- Flow arrows -->
  <line x1="300" y1="330" x2="462" y2="330" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="470" y1="312" x2="175" y2="292" stroke="#22c55e" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="470" y1="348" x2="751" y2="292" stroke="#22c55e" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="175" y1="380" x2="175" y2="442" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="751" y1="380" x2="751" y2="442" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="450" y1="600" x2="420" y2="512" stroke="#eab308" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="790" y1="600" x2="996" y2="512" stroke="#eab308" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="300" y1="600" x2="200" y2="368" stroke="#eab308" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <line x1="940" y1="600" x2="1040" y2="368" stroke="#eab308" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <line x1="420" y1="450" x2="872" y2="330" stroke="#8b5cf6" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <g font-size="13" fill="#475569">
    <rect x="52" y="668" width="18" height="12" rx="3" fill="#dcfce7" stroke="#22c55e"/>
    <text x="78" y="678">public subnet (inbound OK)</text>
    <rect x="290" y="668" width="18" height="12" rx="3" fill="#ffedd5" stroke="#f97316"/>
    <text x="316" y="678">private subnet (egress via NAT)</text>
    <rect x="560" y="668" width="18" height="12" rx="3" fill="#ede9fe" stroke="#8b5cf6"/>
    <text x="586" y="678">free private path to AWS services</text>
    <text x="880" y="678" fill="#94a3b8">solid = data flow · dashed = NAT egress to internet</text>
  </g>
</svg>
